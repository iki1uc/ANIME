<h2>Geo‑Matrix‑Scene · EVO</h2>
<canvas id="geoMatrix" width="600" height="400" style="border:1px solid #333;"></canvas>

<script>
function startGeoMatrix(){
  const c = document.getElementById("geoMatrix");
  const ctx = c.getContext("2d");

  let angle = 0;

  function draw(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,c.width,c.height);

    const size = 20;
    const cols = Math.floor(c.width / size);
    const rows = Math.floor(c.height / size);

    for(let x=0; x<cols; x++){
      for(let y=0; y<rows; y++){
        const dx = x * size;
        const dy = y * size;

        const pulse = Math.sin((x+y)/5 + angle) * 10;

        ctx.strokeStyle = `rgb(${pulse*10+100}, ${pulse*5+150}, 255)`;
        ctx.strokeRect(dx + pulse/2, dy + pulse/2, size - pulse, size - pulse);
      }
    }

    angle += 0.05;
    requestAnimationFrame(draw);
  }

  draw();
}

startGeoMatrix();
</script>
