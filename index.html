<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ANIME · Geo‑Matrix‑Scene EVO+</title>
<style>
  body {
    background:#111;
    color:#eee;
    font-family: monospace;
  }
  #geoMatrix {
    border:1px solid #333;
    margin-top:20px;
  }
</style>
</head>
<body>

<h2>Geo‑Matrix‑Scene · EVO+</h2>
<canvas id="geoMatrix" width="600" height="400"></canvas>

<script>
function startGeoMatrix(){
  const c = document.getElementById("geoMatrix");
  const ctx = c.getContext("2d");

  let angle = 0;

  function draw(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,c.width,c.height);

    const size = 25;
    const cols = Math.floor(c.width / size);
    const rows = Math.floor(c.height / size);

    for(let x=0; x<cols; x++){
      for(let y=0; y<rows; y++){
        const dx = x * size;
        const dy = y * size;

        const depth = Math.sin((x * 0.3) + angle) * 8;
        const rot   = Math.cos((y * 0.3) + angle) * 8;
        const pulse = Math.sin((x+y)/4 + angle) * 12;

        const r = 80 + pulse * 2;
        const g = 120 + depth * 3;
        const b = 255;

        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.lineWidth = 1.5;

        ctx.strokeRect(
          dx + depth,
          dy + rot,
          size - pulse/2,
          size - pulse/2
        );

        if(Math.random() > 0.97){
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
          ctx.fillRect(dx + depth + 8, dy + rot + 8, 3, 3);
        }
      }
    }

    angle += 0.04;
    requestAnimationFrame(draw);
  }

  draw();
}

startGeoMatrix();
</script>

</body>
</html>
