<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A81 · Nano‑Ability‑Status</title>

<style>
  body {
    background:#eef2f5;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    padding:20px;
    display:flex;
    justify-content:center;
  }
  .box {
    width:380px;
    background:#fff;
    border:1px solid #d9dde3;
    border-radius:10px;
    padding:20px;
  }
  h1 { font-size:18px; margin-bottom:10px; }
  .row {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #f0f1f4;
    font-size:14px;
  }
  canvas {
    width:100%;
    max-width:320px;
    background:#fafbfc;
    border:1px solid #e2e5eb;
    border-radius:8px;
    margin:14px 0;
  }
  button {
    background:#1c2230;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    margin-right:6px;
  }
  button:hover { background:#333c4f; }
  .log {
    height:140px;
    overflow-y:auto;
    background:#f9fafb;
    border:1px solid #e2e5eb;
    border-radius:8px;
    padding:10px;
    font-size:12px;
    font-family:ui-monospace;
  }
</style>
</head>
<body>

<div class="box">

  <h1>A81‑Axis · Nano‑Ability</h1>

  <!-- A81 / 9×9 / QI/IQQ/OCTA -->
  <div class="row"><span>A81‑Slots</span><span id="a81">81</span></div>
  <div class="row"><span>9×9‑Engine</span><span id="nine">9</span></div>
  <div class="row"><span>QI/IQQ/OCTA</span><span id="qiocta">Aktiv</span></div>

  <!-- 81.build / 81.rom / 81.scan -->
  <div class="row"><span>81.build</span><span id="build">OK</span></div>
  <div class="row"><span>81.rom</span><span id="rom">OK</span></div>
  <div class="row"><span>81.scan</span><span id="scan">READY</span></div>

  <!-- ANKER / ROOM / TMP -->
  <div class="row"><span>ANKER.room</span><span id="anker">Stabil</span></div>
  <div class="row"><span>NO1.room</span><span id="no1">Neutral</span></div>
  <div class="row"><span>TMP.tmp</span><span id="tmp">Live</span></div>

  <!-- Orbit -->
  <canvas id="orbitCanvas" width="320" height="320"></canvas>

  <!-- Buttons -->
  <button id="pumpBtn">Pump</button>
  <button id="scanBtn">Scan</button>
  <button id="orbitBtn">Orbit+</button>

  <!-- Log -->
  <div class="log" id="logBox">System bereit.</div>

</div>

<script>
  const SYS = {
    a81: 81,
    nine: 9,
    orbit: 0,
    build: "OK",
    rom: "OK",
    scan: "READY",
    anker: "Stabil",
    no1: "Neutral",
    tmp: "Live"
  };

  const logs = [];

  function log(msg){
    const t = new Date().toLocaleTimeString('de-DE');
    logs.push(`[${t}] ${msg}`);
    document.getElementById("logBox").innerHTML = logs.slice(-30).join("<br>");
  }

  function update(){
    document.getElementById("a81").textContent = SYS.a81;
    document.getElementById("nine").textContent = SYS.nine;
    document.getElementById("build").textContent = SYS.build;
    document.getElementById("rom").textContent = SYS.rom;
    document.getElementById("scan").textContent = SYS.scan;
    document.getElementById("anker").textContent = SYS.anker;
    document.getElementById("no1").textContent = SYS.no1;
    document.getElementById("tmp").textContent = SYS.tmp;
  }

  function drawOrbit(){
    const c = document.getElementById("orbitCanvas");
    const ctx = c.getContext("2d");
    const cx = c.width/2, cy = c.height/2;

    ctx.clearRect(0,0,c.width,c.height);

    ctx.beginPath();
    ctx.arc(cx,cy,20,0,2*Math.PI);
    ctx.fillStyle="#1c2230";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx,cy,80,0,2*Math.PI);
    ctx.strokeStyle="#9aa3b5";
    ctx.lineWidth=2;
    ctx.stroke();

    const angle = SYS.orbit * 0.15;
    const ex = cx + Math.cos(angle)*80;
    const ey = cy + Math.sin(angle)*80;

    ctx.beginPath();
    ctx.arc(ex,ey,10,0,2*Math.PI);
    ctx.fillStyle="#4da6ff";
    ctx.fill();
  }

  document.getElementById("pumpBtn").onclick = () => {
    SYS.a81 += 3;
    SYS.tmp = "Pump";
    SYS.orbit++;
    update();
    drawOrbit();
    log("Pump ausgeführt.");
  };

  document.getElementById("scanBtn").onclick = () => {
    SYS.scan = "SCAN OK";
    SYS.orbit += 2;
    update();
    drawOrbit();
    log("Scan durchgeführt.");
  };

  document.getElementById("orbitBtn").onclick = () => {
    SYS.orbit += 1;
    update();
    drawOrbit();
    log("Orbit‑Schritt.");
  };

  update();
  drawOrbit();
  log("A81‑Nano‑Ability geladen.");
</script>

</body>
</html>
