<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKI1UC · ANIME · HISTORY CHESS</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow:hidden;
}
#boardWrap {
  position:relative;
  width:100vw;
  height:100vh;
}
#atmoCanvas, #chessCanvas {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
}
#atmoCanvas { z-index:0; pointer-events:none; }
#chessCanvas { z-index:1; }
</style>
</head>
<body>
<div id="boardWrap">
<canvas id="atmoCanvas"></canvas>
<canvas id="chessCanvas"></canvas>
</div>

<script>
// -------------------------------------------------------------
// 1) CANVAS PIXEL-GRÖSSE SETZEN (WICHTIG!)
// -------------------------------------------------------------
const atmoCanvas = document.getElementById("atmoCanvas");
const chessCanvas = document.getElementById("chessCanvas");

function resizeCanvases() {
  atmoCanvas.width = atmoCanvas.clientWidth;
  atmoCanvas.height = atmoCanvas.clientHeight;
  chessCanvas.width = chessCanvas.clientWidth;
  chessCanvas.height = chessCanvas.clientHeight;
}
resizeCanvases();
window.addEventListener("resize", resizeCanvases);

// -------------------------------------------------------------
// 2) MINI-ATMOBOARD (ANIME)
// -------------------------------------------------------------
class AtmoBoard {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.running = true;
    this.t = 0;
  }
  draw() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    this.t += 0.02;

    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,w,h);

    // Neon-Pulse
    for (let i=0; i<80; i++) {
      const x = (Math.sin(this.t + i)*0.5+0.5)*w;
      const y = (Math.cos(this.t*0.7 + i)*0.5+0.5)*h;
      const r = 2 + Math.sin(this.t+i)*3;
      ctx.fillStyle = `rgba(0,150,255,0.25)`;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
  }
  loop() {
    if (!this.running) return;
    this.draw();
    requestAnimationFrame(()=>this.loop());
  }
  start() { this.loop(); }
}
const atmo = new AtmoBoard(atmoCanvas);
atmo.start();

// -------------------------------------------------------------
// 3) MINI-SCHACHBRETT (sichtbar)
// -------------------------------------------------------------
function renderChess() {
  const ctx = chessCanvas.getContext("2d");
  const w = chessCanvas.width;
  const cs = w/8;
  ctx.clearRect(0,0,w,w);
  for (let r=0; r<8; r++) {
    for (let c=0; c<8; c++) {
      ctx.fillStyle = (r+c)%2===0 ? "#eee" : "#444";
      ctx.fillRect(c*cs, r*cs, cs, cs);
    }
  }
  ctx.fillStyle = "#000";
  ctx.font = `${cs*0.7}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("♟", cs*4, cs*4);
}
renderChess();
</script>
</body>
</html>
