<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ANIME · 81-STATION MONITOR</title>
<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
pre { background:#111; padding:15px; }
</style>
<script type="module">
import { scan9hoch9 } from "./81.scan";

async function loadROM() {
    const txt = await fetch("./81.rom").then(r => r.text());
    const rom = {};
    txt.split("\n").forEach(line => {
        const [k, v] = line.split(":").map(s => s.trim());
        if (k && v !== undefined) rom[k] = v;
    });
    return rom;
}

window.onload = async () => {
    const rom = await loadROM();
    const out = document.getElementById("out");

    setInterval(() => {
        const result = scan9hoch9();

        out.innerText = `
ANIME · 81-STATION

ROM STATE: ${rom.STATE}
READY: ${result.ready}/81
ERRORS: ${result.errors}
STATE: ${result.ready === 81 ? "FULL READY" : "PARTIAL"}
`;
    }, 120);
};
</script>
</head>

<body>
<h1>ANIME · 81-STATION MONITOR</h1>
<pre id="out"></pre>
</body>
</html>
