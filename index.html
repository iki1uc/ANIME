<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKI1UC · ANIME · HISTORY CHESS</title>

    <style>
        body {
            margin:0;
            background:#000;
            color:#fff;
            font-family:Arial, sans-serif;
            overflow:hidden;
        }
        #boardWrap {
            position:relative;
            width:100vw;
            height:100vh;
        }
        #atmoCanvas, #chessCanvas {
            position:absolute;
            top:0; left:0;
            width:100%; height:100%;
        }
        #atmoCanvas { z-index:0; pointer-events:none; }
        #chessCanvas { z-index:1; }

        #controls {
            position:absolute;
            bottom:10px;
            left:10px;
            background:rgba(0,0,0,0.4);
            padding:10px;
            border-radius:6px;
            font-size:14px;
            z-index:10;
        }
        button { margin:3px; }
    </style>
</head>
