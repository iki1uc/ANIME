<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ATMOS · Wasser-Spiegelung</title>
<style>
    body {
        background:#000;
        margin:0;
        overflow:hidden;
    }
    canvas {
        display:block;
        width:100vw;
        height:100vh;
    }
</style>
</head>
<body>

<canvas id="atmCanvas"></canvas>

<script>
const canvas = document.getElementById("atmCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

const COLS = 9;
const ROWS = 9;
let time = 0;

// 81 Slots (wie früher)
const slots = Array.from({length:81}, (_,i)=>({
    value: Math.sin(i*0.2),
}));

function drawAtmosWaterMirror() {
    const W = canvas.width;
    const H = canvas.height;
    const CELL_W = W / COLS;
    const CELL_H = (H/2) / ROWS;

    ctx.clearRect(0,0,W,H);

    // Hintergrund
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#02040a");
    bg.addColorStop(1,"#0a0f1c");
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // OBERER TEIL
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const idx = r*COLS+c;
            const slot = slots[idx];
            const val = slot.value*0.5+0.5;
            const brightness = 40 + val*120;

            const x = c*CELL_W;
            const y = r*CELL_H;

            ctx.fillStyle = `rgba(${brightness},${brightness+20},${brightness+60},0.25)`;
            ctx.fillRect(x,y,CELL_W,CELL_H);
        }
    }

    // Spiegel-Linie
    const mirrorY = H/2;
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(0,mirrorY-1,W,2);

    // UNTERER TEIL (Wasser-Spiegel)
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const idx = r*COLS+c;
            const slot = slots[idx];
            const val = slot.value*0.5+0.5;
            const brightness = 40 + val*120;

            const x = c*CELL_W;
            const y = mirrorY + (ROWS-r-1)*CELL_H;

            const wave = Math.sin(time*0.002 + x*0.03 + r*0.2)*4;

            ctx.fillStyle = `rgba(${brightness},${brightness+30},${brightness+80},0.18)`;
            ctx.fillRect(x,y+wave,CELL_W,CELL_H);

            const fade = (r/ROWS)*0.4;
            ctx.fillStyle = `rgba(0,0,0,${fade})`;
            ctx.fillRect(x,y,CELL_W,CELL_H);
        }
    }

    // Titel
    ctx.fillStyle = "rgba(100,200,255,0.08)";
    ctx.font = "20px Consolas";
    ctx.textAlign = "center";
    ctx.fillText("ATMOS · Wasser-Spiegelung (horizontal)", W/2, 30);
}

function loop(){
    time += 16;
    drawAtmosWaterMirror();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
